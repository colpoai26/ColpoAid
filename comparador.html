<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Comparador de Motores IA · ColpoAId</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0c1018;--bg2:#131923;--bg3:#1a2232;--surface:#202d42;
    --border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.16);
    --text:#dde4f0;--text2:#8b97b4;--text3:#505e7a;
    --blue:#4f8ef7;--blueg:rgba(79,142,247,.14);
    --purple:#a78bfa;--purpleg:rgba(167,139,250,.14);
    --teal:#00d4b8;--ok:#22c97a;--warn:#f5a623;--danger:#e85555;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#f4f6fb;--bg2:#fff;--bg3:#eef1f7;--surface:#fff;
      --border:rgba(0,0,0,.09);--border2:rgba(0,0,0,.16);
      --text:#1a2340;--text2:#5a687e;--text3:#8a97ad;
      --blueg:rgba(79,142,247,.12);--purpleg:rgba(167,139,250,.12);
    }
  }
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.55;padding:20px;max-width:1200px;margin:0 auto}
  h1{font-size:22px;margin-bottom:4px}
  .sub{color:var(--text3);font-size:13px;margin-bottom:20px}
  .card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:16px}
  .row{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
  label{font-size:12px;color:var(--text2);font-weight:600;display:block;margin-bottom:6px}
  input[type=text],textarea,select{width:100%;background:var(--bg3);border:1px solid var(--border);
    border-radius:8px;padding:9px 11px;color:var(--text);font-family:inherit;font-size:13px}
  textarea{resize:vertical;min-height:52px}
  .btn{background:var(--blue);color:#fff;border:none;border-radius:8px;padding:10px 16px;
    font-weight:600;font-size:13px;cursor:pointer;font-family:inherit;transition:.15s}
  .btn:hover{filter:brightness(1.08)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn-g{background:var(--bg3);color:var(--text2);border:1px solid var(--border)}
  .btn-sm{padding:6px 11px;font-size:12px}
  .btn-teal{background:var(--teal);color:#042}
  .drop{border:2px dashed var(--border2);border-radius:10px;padding:26px;text-align:center;
    color:var(--text3);cursor:pointer;font-size:13px}
  .drop:hover{border-color:var(--blue);color:var(--blue)}
  .caso{border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px;background:var(--bg3)}
  .caso-head{display:flex;gap:12px;align-items:center;margin-bottom:10px}
  .thumb{width:60px;height:60px;object-fit:cover;border-radius:8px;border:1px solid var(--border2);flex-shrink:0}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
  th{color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.05em;font-weight:700}
  .motor-claude{color:var(--purple)}
  .motor-gemini{color:var(--teal)}
  .motor-gpt{color:var(--warn)}
  .grado{display:inline-block;padding:2px 8px;border-radius:6px;font-weight:700;font-size:11px;
    background:var(--surface);border:1px solid var(--border)}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid var(--border2);
    border-top-color:var(--blue);border-radius:50%;animation:s .8s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  .score{display:flex;gap:3px;margin-top:6px}
  .score button{width:24px;height:24px;border-radius:5px;border:1px solid var(--border);
    background:var(--surface);color:var(--text2);cursor:pointer;font-size:11px;font-weight:600}
  .score button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
  .muted{color:var(--text3);font-size:11px}
  .err{color:var(--danger);font-size:11px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
  .pill{font-size:11px;background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:3px 10px;color:var(--text2)}
</style>
</head>
<body>

<h1>🔬 Comparador de Motores IA</h1>
<div class="sub">Banco de prueba · ColpoAId / MedicAId · Compara descripción + grado entre motores sobre casos de resultado conocido</div>

<div class="bar">
  <span class="pill">Motores activos: <b id="motores-activos">Claude · Gemini</b></span>
  <span class="pill muted">GPT se activa editando el proxy (listo en el código)</span>
</div>

<div class="card">
  <label>1 · Subí las fotos de colposcopía a comparar</label>
  <div class="drop" id="drop" onclick="document.getElementById('files').click()">
    📤 Click para elegir fotos (podés seleccionar varias a la vez)
  </div>
  <input type="file" id="files" accept="image/*" multiple style="display:none"/>
</div>

<div id="casos"></div>

<div class="card" id="acciones" style="display:none">
  <div class="row" style="align-items:center">
    <button class="btn" id="btn-run" onclick="correrTodos()">▶ Comparar todos los casos</button>
    <button class="btn btn-g btn-sm" onclick="exportarCSV()">⬇ Exportar tabla a CSV</button>
    <span class="muted" id="estado"></span>
  </div>
</div>

<script>
// ── Configuración ──────────────────────────────────────────────
const ENDPOINT = '/api/compare';           // el proxy nuevo
const MOTORES = ['claude','gemini'];        // debe coincidir con MOTORES_A_COMPARAR del proxy
const NOMBRES = {claude:'Claude', gemini:'Gemini', gpt:'GPT'};

let casos = [];  // {id, nombre, dataUrl, resultadoReal, resultados:{motor:{descripcion,grado,ms,error}}, scores:{motor:n}}

document.getElementById('files').addEventListener('change', function(e){
  for (const file of e.target.files){
    if (!file.type.startsWith('image/')) continue;
    const reader = new FileReader();
    reader.onload = () => {
      // Achicar la imagen para no mandar archivos gigantes
      resize(reader.result, 1024, 0.82, (small) => {
        casos.push({
          id: 'c'+Date.now()+Math.random().toString(36).slice(2,6),
          nombre: file.name,
          dataUrl: small,
          resultadoReal: '',
          resultados: null,
          scores: {}
        });
        render();
      });
    };
    reader.readAsDataURL(file);
  }
  e.target.value = '';
});

function resize(dataUrl, maxW, quality, cb){
  const img = new Image();
  img.onload = () => {
    let w = img.width, h = img.height;
    if (w > maxW){ h = Math.round(h * maxW / w); w = maxW; }
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    cv.getContext('2d').drawImage(img, 0, 0, w, h);
    cb(cv.toDataURL('image/jpeg', quality));
  };
  img.src = dataUrl;
}

function render(){
  document.getElementById('acciones').style.display = casos.length ? 'block' : 'none';
  const cont = document.getElementById('casos');
  cont.innerHTML = casos.map((c, idx) => `
    <div class="caso">
      <div class="caso-head">
        <img src="${c.dataUrl}" class="thumb"/>
        <div style="flex:1;min-width:200px">
          <div style="font-weight:600;font-size:13px;margin-bottom:6px">${c.nombre}</div>
          <label>Resultado real conocido (de biopsia / atlas)</label>
          <input type="text" value="${c.resultadoReal||''}" placeholder="Ej: CIN II confirmado por biopsia"
            onchange="casos[${idx}].resultadoReal=this.value"/>
        </div>
        <button class="btn-g btn btn-sm" onclick="borrarCaso(${idx})">✕</button>
      </div>
      ${c.resultados ? renderResultados(c, idx) : ''}
    </div>
  `).join('');
}

function renderResultados(c, idx){
  let filas = MOTORES.map(m => {
    const r = c.resultados[m] || {};
    if (r.error) return `<tr>
      <td class="motor-${m}"><b>${NOMBRES[m]}</b></td>
      <td colspan="3" class="err">⚠️ ${r.error}</td></tr>`;
    return `<tr>
      <td class="motor-${m}"><b>${NOMBRES[m]}</b><div class="muted">${r.ms?Math.round(r.ms/100)/10+'s':''}</div></td>
      <td>${r.descripcion||'—'}</td>
      <td><span class="grado">${r.grado||'—'}</span><div class="muted">conf: ${r.confianza||'—'}</div></td>
      <td>
        <div class="muted">Tu puntaje (1-5):</div>
        <div class="score">
          ${[1,2,3,4,5].map(n=>`<button class="${c.scores[m]===n?'on':''}" onclick="setScore(${idx},'${m}',${n})">${n}</button>`).join('')}
        </div>
      </td>
    </tr>`;
  }).join('');
  return `<table>
    <thead><tr><th>Motor</th><th>Descripción</th><th>Grado arriesgado</th><th>Calidad descripción</th></tr></thead>
    <tbody>${filas}</tbody>
  </table>`;
}

function setScore(idx, m, n){ casos[idx].scores[m] = n; render(); }
function borrarCaso(idx){ casos.splice(idx,1); render(); }

async function correrTodos(){
  const btn = document.getElementById('btn-run');
  const est = document.getElementById('estado');
  btn.disabled = true;
  for (let i=0; i<casos.length; i++){
    est.innerHTML = `<span class="spin"></span> Analizando caso ${i+1} de ${casos.length}...`;
    try{
      const resp = await fetch(ENDPOINT, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ image: casos[i].dataUrl })
      });
      const data = await resp.json();
      if (data.error) throw new Error(data.error);
      casos[i].resultados = data.resultados;
    }catch(e){
      casos[i].resultados = {};
      MOTORES.forEach(m => casos[i].resultados[m] = {error: e.message});
    }
    render();
  }
  est.textContent = '✓ Comparación completa';
  btn.disabled = false;
}

function exportarCSV(){
  let rows = [['Caso','Resultado real','Motor','Descripción','Grado arriesgado','Confianza','Tu puntaje','ms']];
  casos.forEach(c => {
    MOTORES.forEach(m => {
      const r = (c.resultados&&c.resultados[m]) || {};
      rows.push([
        c.nombre, c.resultadoReal, NOMBRES[m],
        (r.descripcion||r.error||'').replace(/\n/g,' '),
        r.grado||'', r.confianza||'', c.scores[m]||'', r.ms||''
      ]);
    });
  });
  const csv = rows.map(r => r.map(x => `"${String(x).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['﻿'+csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'comparacion_motores_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
}

// Mostrar motores activos
document.getElementById('motores-activos').textContent = MOTORES.map(m=>NOMBRES[m]).join(' · ');
</script>
</body>
</html>
